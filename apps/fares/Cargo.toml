[package]
name = "fares"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bigdecimal = "0.4"
bumpalo = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
crossbeam-channel = "0.5"
dotenvy = "0.15.7"
flate2 = "1"
hex = "0.4"
native-tls = "0.2"
num_cpus = "1"
postgres = "0.19"
postgres-native-tls = "0.5"
quick-xml = "0.37"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "lzma", "time", "zstd"] }
